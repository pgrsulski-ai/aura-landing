<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA MUSIC | The Sovereign AI Sound Arena</title>

  <!-- Google AdSense Verification -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7186713825782812" crossorigin="anonymous"></script>

  <!-- Umami Analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="3f656a0e-3c9b-42aa-bf42-3681a90ddab5"></script>

  <!-- Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(0, 245, 160, 0.3);
      --primary: #00f5a0;
      --primary-glow: rgba(0, 245, 160, 0.45);
      --cyan: #00d2ff;
      --violet: #8a2be2;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .ambient-glow {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 10%, rgba(0, 245, 160, 0.08) 0%, rgba(0, 210, 255, 0.04) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      transition: all 0.25s ease-out;
    }

    .glass-card:hover {
      border-color: var(--card-border-glow);
      transform: translateY(-2px);
    }

    .neon-btn {
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      color: #030712;
      font-weight: 700;
      transition: all 0.2s ease-out;
      box-shadow: 0 0 20px rgba(0, 245, 160, 0.3);
    }

    .neon-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="relative flex flex-col justify-between selection:bg-emerald-500 selection:text-black">
  <div class="ambient-glow"></div>

  <!-- Navbar -->
  <header class="relative z-10 w-full border-b border-white/5 bg-slate-950/60 backdrop-blur-md sticky top-0">
    <div class="max-w-4xl mx-auto px-5 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-400/20 border border-emerald-400/40 flex items-center justify-center font-black text-emerald-400">A</div>
        <span class="font-extrabold tracking-wider text-lg text-white">AURA<span class="text-emerald-400">MUSIC</span></span>
      </div>
      <a href="https://auramusic.net" class="neon-btn text-xs uppercase tracking-wider px-4 py-2 rounded-lg flex items-center gap-1.5">
        Launch App
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="relative z-10 max-w-4xl mx-auto px-5 py-8 w-full">
    <!-- Hero / Intro -->
    <section class="mb-10 text-center sm:text-left">
      <div class="inline-block px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-3">
        Gamified AI Sound
      </div>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4 text-white">
        Latest Insights & Guides
      </h1>
      <p class="text-slate-400 text-sm sm:text-base max-w-xl">
        Deep dives into AI music generation, prompt crafting, and arena meta.
      </p>
    </section>

    <!-- Articles Feed -->
    <section class="flex flex-col gap-5" id="articles-container">
      <div class="text-slate-500 text-sm py-8 text-center animate-pulse">Loading articles...</div>
    </section>
  </main>

  <!-- Modal do czytania artykułu -->
  <div id="article-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
    <div class="glass-card max-w-2xl w-full max-h-[85vh] rounded-2xl overflow-y-auto p-6 sm:p-8 flex flex-col gap-4 text-slate-200">
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <span id="modal-category" class="text-xs font-semibold text-emerald-400 uppercase tracking-wider"></span>
        <button id="modal-close" class="text-slate-400 hover:text-white text-lg font-bold p-1">✕</button>
      </div>
      <h2 id="modal-title" class="text-2xl font-bold text-white"></h2>
      <div class="flex items-center gap-3 text-xs text-slate-400">
        <span id="modal-date"></span>
        <span>•</span>
        <span id="modal-readTime"></span>
      </div>
      <div id="modal-content" class="text-sm leading-relaxed text-slate-300 space-y-4 pt-2 whitespace-pre-line border-t border-white/5"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="relative z-10 w-full border-t border-white/5 py-8 mt-16 text-center text-xs text-slate-500">
    <div class="max-w-4xl mx-auto px-5 flex flex-col gap-3">
      <p>&copy; 2026 Aura Music. All rights reserved.</p>
      <div class="flex justify-center gap-4 text-slate-400">
        <a href="#" class="hover:text-white">Privacy Policy</a>
        <a href="#" class="hover:text-white">Terms of Service</a>
        <a href="#" class="hover:text-white">Disclaimer</a>
      </div>
    </div>
  </footer>

  <!-- Dynamic Articles Script -->
  <script>
    async function loadArticles() {
      const container = document.getElementById('articles-container');
      try {
        const res = await fetch('articles.json');
        if (!res.ok) throw new Error('Network error');
        const articles = await res.json();
        
        container.innerHTML = articles.map(art => {
          const description = art.desc || art.description || art.summary || art.excerpt || '';
          return `
            <article class="glass-card rounded-xl p-5 sm:p-6 flex flex-col gap-3 cursor-pointer group" onclick="openModal(${art.id})">
              <div class="flex items-center justify-between text-xs font-semibold">
                <span class="text-emerald-400 uppercase tracking-wider">${art.category || 'General'}</span>
                <span class="text-slate-500">${art.readTime || '3 min read'}</span>
              </div>
              <h2 class="text-lg sm:text-xl font-bold text-white group-hover:text-emerald-300 transition-colors">
                ${art.title}
              </h2>
              ${description ? `<p class="text-sm text-slate-400 line-clamp-2 leading-relaxed">${description}</p>` : ''}
              <div class="text-xs font-bold text-emerald-400 flex items-center gap-1 pt-1">
                Read article &rarr;
              </div>
            </article>
          `;
        }).join('');

        window._articlesData = articles;
      } catch (err) {
        container.innerHTML = '<div class="text-rose-400 text-sm py-4">Failed to load articles. Ensure articles.json is present.</div>';
      }
    }

    function openModal(id) {
      if (!window._articlesData) return;
      const art = window._articlesData.find(a => a.id === id);
      if (!art) return;

      document.getElementById('modal-title').textContent = art.title;
      document.getElementById('modal-category').textContent = art.category || 'General';
      document.getElementById('modal-date').textContent = art.date || '';
      document.getElementById('modal-readTime').textContent = art.readTime || '';
      document.getElementById('modal-content').innerText = art.content || '';

      const modal = document.getElementById('article-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeModal() {
      const modal = document.getElementById('article-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('article-modal').addEventListener('click', (e) => {
      if (e.target.id === 'article-modal') closeModal();
    });

    document.addEventListener('DOMContentLoaded', loadArticles);
  </script>

  <!-- Reklama Adsterra (Social Bar) -->
  <script type='text/javascript' src='//pl24982631.profitablecpmrate.com/d9/a2/b5/d9a2b5e28ffbc2a98f1f7d4c2ce619f7.js'></script>
</body>
</html>
